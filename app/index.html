<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit</title>
<meta name="theme-color" content="#0B0A14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  /* Orbit on the phone: black like the notch, one card per request, big thumbs-first buttons. */
  :root {
    color-scheme: dark;
    --bg: #0B0A14; --card: #17151F; --line: rgba(255,255,255,.09); --fg: #F4F2FB; --muted: #A29EB8;
    --faint: #6E6A85; --amber: #FFB020; --green: #30D158;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--sans); }
  body { min-height: 100dvh; padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 34px; height: 34px; border-radius: 9px; }
  header h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .ask { border-color: rgba(255,176,32,.35); }
  .who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--amber); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  h2 { font-size: 17px; margin: 0; line-height: 1.3; }
  .reason { color: var(--muted); font-size: 14px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 12px; color: var(--faint); }
  .field .value { white-space: pre-wrap; font-size: 15px; }
  .field .value.long { border-left: 2px solid var(--line); padding-left: 10px; color: rgba(255,255,255,.88); }
  input, textarea { font: inherit; color: var(--fg); background: #0F0E17; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; }
  textarea { min-height: 120px; resize: vertical; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 12px 18px; min-height: 44px; cursor: pointer; background: rgba(255,255,255,.1); color: var(--fg); }
  button.primary { background: #fff; color: #000; }
  button.quiet { background: none; color: var(--muted); padding-inline: 10px; }
  button:disabled { opacity: .5; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #A196FC; outline-offset: 2px; }
  .empty { text-align: center; padding: 36px 16px; }
  .empty .big { font-size: 40px; }
  .note { font-size: 13px; color: var(--muted); background: rgba(255,255,255,.04); border-radius: 14px; padding: 12px; }
  .error { color: var(--amber); font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon-192.png" alt="">
    <h1>Orbit</h1>
    <button id="sign-out" class="quiet small" hidden>Sign out</button>
  </header>

  <!-- Sign in -->
  <section id="signin" class="card" hidden>
    <h2>Answer your bots from your phone</h2>
    <p class="muted small" style="margin:0">Sign in with the same email as Orbit on your Mac. We'll email you a code.</p>
    <div id="step-email" class="row">
      <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@company.com" aria-label="Email">
      <button id="send" class="primary">Send code</button>
    </div>
    <div id="step-code" class="row" hidden>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" aria-label="Code">
      <button id="verify" class="primary">Sign in</button>
    </div>
    <p id="signin-error" class="error" hidden></p>
  </section>

  <!-- Signed in -->
  <section id="home" hidden>
    <div id="notify" class="note" hidden>
      <div id="notify-text">Get a notification when a bot needs your OK.</div>
      <div class="row" style="margin-top:8px"><button id="enable-push">Turn on notifications</button></div>
    </div>
    <div id="list" style="display:flex;flex-direction:column;gap:12px;margin-top:12px"></div>
    <p id="home-error" class="error" hidden></p>
  </section>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
